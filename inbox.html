<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Contractor inbox | J&A</title><link rel="stylesheet" href="/styles.css"><script src="/inbox.js" defer></script><style>main{max-width:900px;margin:auto;padding:24px 18px}article,#login{background:white;border-radius:18px;padding:22px;margin:18px 0}label{display:block;margin:14px 0}input,select,textarea{width:100%;padding:12px;font:inherit;box-sizing:border-box}textarea{min-height:100px}.actions{display:flex;gap:12px;flex-wrap:wrap}#message{white-space:pre-line}p.details{white-space:pre-line;overflow-wrap:anywhere}[hidden]{display:none!important}.due{color:#a33;font-weight:bold}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">J&A</span><span><strong>Contractor inbox</strong><small>Customer estimate requests</small></span></a></header><main><h1>Your customer requests</h1><p id="message" role="status" aria-live="polite"></p><form id="login"><p>Sign in with your authorized contractor email. Open the email link in this browser.</p><label>Email<input id="email" type="email" autocomplete="email" required></label><button class="primary">Email my sign-in link</button></form><section id="inbox" hidden><div class="actions"><button id="refresh">Refresh</button><button id="logout">Sign out</button></div><label>Show<select id="filter"><option value="all">All requests</option><option value="due">Follow-ups due</option><option>new</option><option>contacted</option><option>quoted</option><option>won</option><option>lost</option></select></label><p>Follow-up dates use your device’s local time. Saved dates appear here; reminder emails are not configured.</p><div id="requests"></div><button id="more" hidden>Load older requests</button></section></main></body></html>
