  <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>J&amp;A Local B2B Lead Hunter</title>
  <style>
    :root{color-scheme:dark;--green:#76d275;--panel:#172019;--line:#324438;--muted:#b8c5bb}
    *{box-sizing:border-box}body{margin:0;background:#0b100c;color:#f5f7f5;font-family:system-ui,-apple-system,sans-serif}
    main{width:min(920px,calc(100% - 28px));margin:40px auto}h1{margin-bottom:8px;font-size:clamp(1.8rem,6vw,3rem)}
    .intro{color:var(--muted);margin-top:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
    form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{display:grid;gap:7px;font-weight:700}
    input,select,button{min-height:48px;border-radius:10px;border:1px solid var(--line);font:inherit;padding:10px 12px}
    input,select{background:#0f1611;color:white}button{background:var(--green);color:#071008;font-weight:800;border:0;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;color:var(--muted);margin:18px 0 8px}.error{color:#ff9b9b!important}
    .results{display:grid;gap:12px}.lead{border:1px solid var(--line);border-radius:14px;padding:16px;background:#101712}
    .lead h2{font-size:1.12rem;margin:0 0 8px}.lead p{margin:5px 0;color:var(--muted)}.lead a{color:var(--green)}
    .lead-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.copy-script{min-height:40px;padding:8px 12px;border-radius:9px;background:var(--green);color:#071008}
    @media(max-width:720px){form{grid-template-columns:1fr}main{margin-top:24px}}
  </style>
</head>
<body>
<main>
  <h1>J&amp;A Local B2B Lead Hunter</h1>
  <p class="intro">Find nearby organizations that may regularly need tree and lawn contractors.</p>
  <section class="card">
    <form id="search-form">
      <label>Service area
        <input id="location" name="location" value="Crossville, TN" maxlength="100" required>
      </label>
      <label>Business type
        <select id="service" name="service">
          <option value="property management">Property management</option>
          <option value="real estate agency">Real estate agencies</option>
          <option value="general contractor">General contractors</option>
          <option value="golf course">Golf courses and parks</option>
          <option value="apartment complex">Apartment complexes</option>
          <option value="homeowners association">Homeowners associations</option>
        </select>
      </label>
      <button id="submit" type="submit">Hunt local leads</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="results" class="results"></div>
  </section>
</main>
<script>
  const form=document.querySelector('#search-form');
  const statusEl=document.querySelector('#status');
  const resultsEl=document.querySelector('#results');
  const button=document.querySelector('#submit');
  let currentResults=[];
  const escapeHtml=(value)=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const copyText=async(text)=>{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return;}
    const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();
  };
  form.addEventListener('submit',async(event)=>{
    event.preventDefault();button.disabled=true;resultsEl.innerHTML='';statusEl.className='';statusEl.textContent='Searching nearby businesses…';
    const params=new URLSearchParams(new FormData(form));
    try{
      const response=await fetch(`/api/leads?${params}`);const data=await response.json();
      if(!response.ok||!data.success)throw new Error(data.error||'The search could not be completed.');
      currentResults=data.results||[];
      statusEl.textContent=`Found ${data.results.length} possible business leads.`;
      if(!data.results.length){resultsEl.innerHTML='<p>No results found. Try a nearby city or another business type.</p>';return;}
      resultsEl.innerHTML=data.results.map((lead,index)=>`<article class="lead"><h2>${escapeHtml(lead.name)}</h2><p>${escapeHtml(lead.address||'Address unavailable')}</p><p>Rating: ${escapeHtml(lead.rating??'N/A')} · Reviews: ${escapeHtml(lead.review_count??0)}</p>${lead.phone?`<p><a href="tel:${escapeHtml(lead.phone)}">${escapeHtml(lead.phone)}</a></p>`:''}<div class="lead-actions">${lead.url?`<a href="${escapeHtml(lead.url)}" target="_blank" rel="noopener">View business</a>`:''}<button class="copy-script" type="button" data-lead-index="${index}">Copy call opener</button></div></article>`).join('');
    }catch(error){statusEl.className='error';statusEl.textContent=error.message;}
    finally{button.disabled=false;}
  });
  resultsEl.addEventListener('click',async(event)=>{
    const copyButton=event.target.closest('.copy-script');if(!copyButton)return;
    const lead=currentResults[Number(copyButton.dataset.leadIndex)];if(!lead)return;
    const script=`Hi, this is Alex with J&A Tree and Lawn Service. I'm reaching out because we help local organizations with tree removal, trimming, storm cleanup, and ongoing property maintenance. I wanted to ask who handles tree and grounds work for ${lead.name}, and whether you'd be open to keeping our information on file for estimates or emergency service?`;
    try{await copyText(script);copyButton.textContent='Copied';setTimeout(()=>{copyButton.textContent='Copy call opener';},1600);}catch{statusEl.className='error';statusEl.textContent='Could not copy the call opener.';}
  });
</script>
</body>
</html>
